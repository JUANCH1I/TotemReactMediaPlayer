plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.kiosk'
version = '0.1.0'

android {
  namespace "expo.modules.kiosk"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // A totem being set up has no internet, so the setup page and its QR code
  // are served and drawn by the device itself.
  implementation 'org.nanohttpd:nanohttpd:2.3.1'
  implementation 'com.google.zxing:core:3.5.3'
}
